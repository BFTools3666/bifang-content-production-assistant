[workspace]
members = [
  "bifang_content_production_assistant_core",
  "bifang_content_production_assistant_cli",
  "bifang_content_production_assistant_gui/src-tauri",
]
resolver = "3"

[workspace.metadata.agent-first-harness]
target-platforms = ["windows", "macos"]
interfaces = ["cli", "gui"]
gui-root = "bifang_content_production_assistant_gui"
version-mirrors = ["bifang_content_production_assistant_gui/package.json", "bifang_content_production_assistant_gui/src-tauri/tauri.conf.json"]

[workspace.package]
version = "0.2.25"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
assert_cmd = "2.2.2"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
bifang_content_production_assistant_core = { path = "bifang_content_production_assistant_core" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jiff = "0.2.35"
keyring = "4.2.0"
mac-usernotifications = "0.3.1"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls"] }
rust-i18n = "4.2.2"
sea-orm = { version = "2.0.2", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-sqlite", "with-json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-build = "2.6.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-notification = "2.4.0"
tauri-plugin-os = "2.3.2"
tauri-plugin-single-instance = { version = "2.4.4", features = ["deep-link"] }
tauri-plugin-updater = "2.11.0"
tauri-plugin-window-state = "2.4.1"
tempfile = "3.27.0"
tokio = { version = "1.53.1", default-features = false, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
uuid = { version = "1.26.1", features = ["v4"] }
