[package]
name = "bifang_content_production_assistant_gui"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true

[lib]
name = "bifang_content_production_assistant_gui"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "bifang_content_production_assistant_gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
base64 = { workspace = true }
bifang_content_production_assistant_core = { workspace = true }
image = { workspace = true }
keyring = { workspace = true }
pulldown-cmark = { workspace = true }
reqwest = { workspace = true }
rust-i18n = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-global-shortcut = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-os = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-autostart = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = { workspace = true }
